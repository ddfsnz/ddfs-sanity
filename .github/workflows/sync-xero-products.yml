name: Xero Integration
run-name: Sync products from Xero
on:
  push:
    branches: [main]
  # schedule:
  # Run daily at 9 AM UTC
  # - cron: '0 9 * * *'
jobs:
  Sync-Xero-Products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Get Last Run Timestamp
        id: last-run
        run: |
          # Get workflow ID first
          WORKFLOW_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows" \
            | jq -r '.workflows[] | select(.name == "Xero Integration") | .id')

          echo "Workflow ID: $WORKFLOW_ID"

          if [ "$WORKFLOW_ID" != "null" ] && [ -n "$WORKFLOW_ID" ]; then
            LAST_RUN=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/runs?status=completed&per_page=2" \
              | jq -r '.workflow_runs[1].updated_at // "1970-01-01T00:00:00Z"')
          else
            LAST_RUN="1970-01-01T00:00:00Z"
          fi

          echo "Last run timestamp: $LAST_RUN"
          echo "timestamp=$LAST_RUN" >> $GITHUB_OUTPUT
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        working-directory: ./scripts
        run: npm ci
      - name: Build TypeScript
        working-directory: ./scripts
        run: npm run build
      - name: Run Script
        env:
          XERO_CLIENT_ID: ${{ secrets.XERO_CLIENT_ID }}
          XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          LAST_RUN_TIMESTAMP: ${{ steps.last-run.outputs.timestamp }}
        run: node scripts/build/syncXeroProducts.js
